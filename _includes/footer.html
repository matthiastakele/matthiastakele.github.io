<footer class="footer">
  <div class="footer__inner">
    <div class="footer__note">
      <span class="footer__note__name">Matthias Takele</span>
      <span class="footer__note__meta">Designed &amp; built from scratch &middot; {{ site.time | date: '%Y' }}</span>
    </div>
    <nav class="footer__links" aria-label="Social links">
      {% for link in site.social %}
      <a href="{{link.url}}" target="_blank" rel="noopener">{{link.title}}</a>
      {% endfor %}
    </nav>
  </div>
</footer>
